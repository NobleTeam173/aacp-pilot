<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AACP™ Workforce Intelligence — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/assets/app-CXRzVUWS.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/app-CpsLeBW1.css">
  </head>
  <body>
    <div id="root"></div>
  
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "17b24ef1724e440493b9ca2a17a5a1ad"}'></script><!-- End Cloudflare Web Analytics -->
<!-- Cookie Consent + GA4 -->
<div id="aacp-consent" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#100614;border-top:1px solid #2e103580;padding:16px 6vw;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:DM Sans,system-ui,sans-serif;box-shadow:0 -4px 24px #00000066;">
  <p style="color:#9490a0;font-size:13px;line-height:1.6;margin:0;max-width:680px;">We use Google Analytics to understand how visitors use AACP™. No data is collected without your consent. <a href="/privacy.html" style="color:#e05575;text-decoration:none;">Privacy Policy</a></p>
  <div style="display:flex;gap:10px;flex-shrink:0;">
    <button id="aacp-decline" style="background:transparent;border:1px solid #2e1035;color:#9490a0;border-radius:8px;padding:9px 20px;font-size:13px;cursor:pointer;font-family:inherit;transition:border-color .2s;">Decline</button>
    <button id="aacp-accept" style="background:#80011f;border:none;color:#fff;border-radius:8px;padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;">Accept Analytics</button>
  </div>
</div>
<script>
(function(){
  var KEY='aacp_analytics_consent',GA='G-VLCNTPCTPD';
  function loadGA(){
    var s=document.createElement('script');
    s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id='+GA;
    document.head.appendChild(s);
    window.dataLayer=window.dataLayer||[];
    window.gtag=function(){dataLayer.push(arguments);};
    gtag('js',new Date());gtag('config',GA);
  }
  function randomHex64(){
    var b=new Uint8Array(32);crypto.getRandomValues(b);
    return Array.from(b).map(function(x){return x.toString(16).padStart(2,'0');}).join('');
  }
  function recordConsent(decision){
    try{
      fetch('/consent/record',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({sessionHash:randomHex64(),decision:decision,page:location.pathname}),
        keepalive:true
      }).catch(function(){});
    }catch(e){}
  }
  try{
    var c=localStorage.getItem(KEY);
    if(c==='accepted'){loadGA();return;}
    if(c==='declined'){return;}
  }catch(e){}
  var b=document.getElementById('aacp-consent');
  if(b)b.style.display='flex';
  document.getElementById('aacp-accept').addEventListener('click',function(){
    try{localStorage.setItem(KEY,'accepted');}catch(e){}
    b.style.display='none';recordConsent('accepted');loadGA();
  });
  document.getElementById('aacp-decline').addEventListener('click',function(){
    try{localStorage.setItem(KEY,'declined');}catch(e){}
    b.style.display='none';recordConsent('declined');
  });
})();
</script>
<!-- End Cookie Consent + GA4 -->
</body>
</html>
